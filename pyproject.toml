[project]
name = "claude-team"
version = "0.1.0"
description = "Launch named Claude Code sessions for a Boss / Developer / QA agent team."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Jesse Hartman", email = "59590184+jesshart@users.noreply.github.com" }]
dependencies = ["typer>=0.12"]

[project.urls]
Homepage = "https://github.com/jesshart/claude-team"
Repository = "https://github.com/jesshart/claude-team"

[project.scripts]
claude-team = "claude_team.cli:app"
cteam = "claude_team.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_team"]
